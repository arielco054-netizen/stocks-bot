name: Run Stock Bot

on:
  schedule:
    # 13:30 שעון ישראל (10:30 UTC) - לפני פתיחת המסחר
    - cron: '30 10 * * 1-5'
    # 23:10 שעון ישראל (20:10 UTC) - 10 דקות אחרי סגירת המסחר
    - cron: '10 20 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance requests pytz 

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py
