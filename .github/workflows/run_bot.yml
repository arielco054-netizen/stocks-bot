name: Run Stock Bot Automatically

on:
  workflow_dispatch:
  schedule:
    # 23:00 בישראל (UTC+3 בקיץ זה 20:00 UTC, בחרנו 20:00 UTC כדי שיצא בדיוק 23:00 אצלנו)
    - cron: '0 20 * * *'
    # מוצאי שבת בשעה 21:00 בישראל (18:00 UTC)
    - cron: '0 18 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
