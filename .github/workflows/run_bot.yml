name: Run Stock Bot

on:
  schedule:
    # שעון UTC - שעת ישראל היא UTC+3 (בשעון קיץ) או UTC+2 (בשעון חורף)
    # נגדיר כאן 3 פעמים ביום:
    - cron: '30 13 * * 1-5' # 16:30 ישראל - שעה לפני הפתיחה
    - cron: '0 20 * * 1-5'  # 23:00 ישראל - סגירת המסחר
    - cron: '0 5 * * *'     # 08:00 ישראל - בוקר לשוק הישראלי/קריפטו
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # הוספנו את הספריה pytz לכאן
        run: |
          pip install --upgrade pip
          pip install yfinance requests pytz 

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py
